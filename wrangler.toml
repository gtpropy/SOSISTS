name = "ists-sos"
pages_build_output_dir = "out"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# --- CATALYST bindings (functions/catalyst/*) ---
[[d1_databases]]
binding = "CATALYST_DB"
database_name = "catalyst-db"
database_id = "8e6ca8ba-e67b-420f-a9d4-ec3504ff8bb0"

[[r2_buckets]]
binding = "CATALYST_UPLOADS"
bucket_name = "catalyst-uploads"

# Secrets (never put real values here — set them with wrangler instead):
#   wrangler pages secret put SESSION_SECRET
#   wrangler pages secret put UPLOAD_SIGNING_SECRET
# Generate each with: openssl rand -hex 32
